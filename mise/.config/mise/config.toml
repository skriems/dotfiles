[tools]
node = "22.22.2"
python = "3.14.7"

[settings]
idiomatic_version_file_enable_tools = ["node", "python"]

[hooks]
postinstall = '''
if printf '%s' "$MISE_INSTALLED_TOOLS" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"node"'; then
    printf '%s' "$MISE_INSTALLED_TOOLS" |
        jq -r '.[] | select(.name == "node") | .install_path' |
        while IFS= read -r install_path; do
            "$install_path/bin/npm" install --global --ignore-scripts --prefix "$install_path" \
                @earendil-works/chord@1.1.0 \
                @earendil-works/pi-ai@1.1.0 \
                @earendil-works/pi-coding-agent@1.1.0 \
                @earendil-works/pi-durable@1.1.0 \
                @openai/codex@0.154.0 \
                @playwright/cli@0.1.21 \
                mcp-hub@4.2.1 \
                neovim@5.5.0
        done
fi
'''
